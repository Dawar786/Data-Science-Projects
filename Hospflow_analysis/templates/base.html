<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HospFlow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a class="brand" href="{{ url_for('home') }}">🏥 HospFlow</a>
    <a href="{{ url_for('beds') }}">🔴 Beds</a>
    <a href="{{ url_for('doctors') }}">👨‍⚕️ Doctors</a>
    <a href="{{ url_for('my_appointments') }}">📅 Appointments</a>
    <a href="{{ url_for('tests') }}">🧪 Tests</a>
    <a href="{{ url_for('reports') }}">📄 Reports</a>
    <a href="{{ url_for('oxygen') }}">🫁 Oxygen</a>
    <a href="{{ url_for('hospitals') }}">🏥 Hospitals</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
